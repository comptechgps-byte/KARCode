apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: agentic-demo
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: agentic-demo
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: cache-proxy
  namespace: agentic-demo
spec:
  selector: { app: cache-proxy }
  ports: [{ port: 6379, targetPort: 6379 }]
